# Keeps every pull request in one shape: a "Type: Summary" title, the template's "What and why"
# filled in, an assignee and at least one label. It assigns the author and adds the type label
# itself, then fails with what's missing. pull_request_target is safe here: it checks out no code
# and only reads and edits the pull request's own metadata.
name: PR conventions

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled, assigned, unassigned]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    name: PR conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const TYPES = ['Feat', 'Fix', 'Docs', 'Design', 'Refactor', 'Perf', 'Test', 'Build', 'CI', 'Chore', 'Security', 'Deps', 'Release', 'Revert']
            const TITLE = new RegExp(`^(${TYPES.join('|')})(\\([a-z0-9-]+\\))?: [A-Z0-9].{3,}$`)
            const { owner, repo } = context.repo
            const number = context.payload.pull_request.number
            // Read it fresh: earlier steps of this run, or another event, may have changed it.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number })
            const bot = pr.user.type === 'Bot'
            const problems = []

            // Dependabot writes its own titles ("Deps: bump …"); only the type is checked for bots.
            const type = pr.title.match(/^([A-Za-z]+)(\([a-z0-9-]+\))?:/)?.[1]
            if (bot ? !TYPES.includes(type) : !TITLE.test(pr.title))
              problems.push(`Title: use "Type: Summary", e.g. "Fix: Keep full screen working after a page switch". Types: ${TYPES.join(', ')}. An area may follow the type, e.g. "Fix(cli): …".`)

            if (TYPES.includes(type)) {
              const label = `type: ${type.toLowerCase()}`
              const stale = pr.labels.map((l) => l.name).filter((n) => n.startsWith('type: ') && n !== label)
              for (const name of stale) await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name })
              if (!pr.labels.some((l) => l.name === label)) await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [label] })
            }

            if (!pr.assignees.length) {
              const who = bot ? owner : pr.user.login
              await github.rest.issues.addAssignees({ owner, repo, issue_number: number, assignees: [who] })
            }

            if (!bot) {
              const body = (pr.body ?? '').replace(/<!--[\s\S]*?-->/g, '')
              const why = body.match(/## What and why\s*\n([\s\S]*?)(\n## |$)/)?.[1]?.trim()
              if (!why) problems.push('Description: fill in "What and why" from the pull request template.')
            }

            const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: number })
            if (!fresh.labels.length) problems.push('Labels: add at least one label.')
            if (!fresh.assignees.length) problems.push('Assignee: assign someone.')

            if (problems.length) core.setFailed(problems.map((p) => `• ${p}`).join('\n'))
