name: Visual baselines

# Re-renders the visual regression baselines in the same Playwright Linux image
# the CI `visual` job compares in, for when no local Docker is at hand. Run it
# from the Actions tab (or `gh workflow run visual-baselines.yml --ref <branch>`),
# then apply the result to that branch, review the PNGs and commit:
#   rm -rf tests/storybook/__screenshots__ && gh run download <run-id> -n visual-baselines -D tests/storybook/__screenshots__
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Re-render the visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in step with @playwright/test and the `visual` job in ci.yml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      # Stale baselines are deleted first, so shots of removed stories don't linger.
      - run: rm -rf tests/storybook/__screenshots__
      - run: pnpm test:visual:update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-baselines
          path: tests/storybook/__screenshots__
          if-no-files-found: error
          retention-days: 14
