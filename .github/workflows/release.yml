name: Release

# Publishing is a decision, never a side effect of a merge: this only runs
# when started by hand (Actions → Release → Run workflow), only from main, and
# a real publish waits for a reviewer to approve the `release` environment
# (Settings → Environments). Versions come from changesets in pull requests;
# see RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Where to publish
        type: choice
        options: [npm, github]
        default: npm
      channel:
        description: latest for a release, next for a prerelease (0.5.0-next.1) for testers
        type: choice
        options: [latest, next]
        default: latest
      dry-run:
        description: Build and pack, but don't publish
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to ${{ inputs.registry }}
    # Not a branch or tag: a release is built from main's reviewed history.
    if: github.ref == 'refs/heads/main'
    # Required reviewers on this environment are the approval gate. The npm token is a secret of
    # this environment, so no other job can read it. The rehearsal asks for approval too, which is
    # the price of one job; it publishes nothing.
    environment: release
    # ubuntu-24.04, not latest: Playwright can't install its browsers on ubuntu-latest (26.04) yet (2026-10-26). Move back when it can.
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # verify, both smoke tests and a docs build run in one job on a hosted runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # npm publishes through trusted publishing (OIDC), which needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global npm@11
      - run: pnpm verify
      # A release is dated in the changelog; the packed packages install and render in fresh apps.
      - run: pnpm check:changelog
      - name: Browsers for the smoke tests
        # No --with-deps: the ubuntu-24.04 image already carries Chrome's libraries, and that apt step took 10-20 minutes (2026-10-26).
        run: pnpm exec playwright install chromium
      - run: pnpm smoke --motion 13.4.4 --base-ui 1.8.0
      - run: pnpm smoke --motion ^14 --base-ui ~1.9.0
      - name: Docs build
        run: pnpm -F docs build
      - name: Rehearse
        if: inputs.dry-run
        run: pnpm release:dry --to ${{ inputs.registry }}
        env:
          YOUJ_NPM_TAG: ${{ inputs.channel == 'next' && 'next' || '' }}
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm release --to ${{ inputs.registry }}
        env:
          YOUJ_NPM_TAG: ${{ inputs.channel == 'next' && 'next' || '' }}
          # npm takes no token: each package trusts this workflow in the release environment (trusted
          # publishing, which also signs provenance). GitHub Packages takes the workflow's token.
          NODE_AUTH_TOKEN: ${{ inputs.registry == 'github' && secrets.GITHUB_TOKEN || '' }}
