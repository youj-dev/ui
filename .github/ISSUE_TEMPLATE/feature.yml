name: Feature request
description: Suggest a component, a change to an existing one, or a docs improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For a question or an early idea, a [discussion](https://github.com/youj-dev/ui/discussions) is the better place. Start one before you write a large change.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to do that Youj doesn't let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the component, prop or docs look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: conventions
    attributes:
      label: Fit with the conventions
      description: Youj uses semantic color and motion tokens, a designed reduced-motion state, and full keyboard and screen-reader support. A proposal should keep all three.
      options:
        - label: I have read the conventions in CONTRIBUTING.md and this proposal follows them.
          required: true
